name: SFTP check

# Read-only: connects to GoDaddy with the SFTP secrets and lists the root folder. Uploads nothing.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-elaiuv]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_ROOT_PATH: ${{ secrets.SFTP_ROOT_PATH }}
        run: |
          missing=0
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD SFTP_PORT SFTP_ROOT_PATH; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; else echo "$v is set"; fi
          done
          exit $missing
      - name: List the root folder
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_ROOT_PATH: ${{ secrets.SFTP_ROOT_PATH }}
        run: |
          # Secrets pasted from a web page can carry stray spaces or line breaks: strip them
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          SFTP_HOST=$(trim "$SFTP_HOST"); SFTP_USER=$(trim "$SFTP_USER"); SFTP_PORT=$(trim "$SFTP_PORT"); SFTP_ROOT_PATH=$(trim "$SFTP_ROOT_PATH")
          SSHPASS=$(printf '%s' "$SSHPASS" | tr -d '\r\n'); export SSHPASS
          case "$SFTP_USER" in *[!A-Za-z0-9._-]*) echo "::error::SFTP_USER still has unusual characters after trimming (length ${#SFTP_USER})";; esac
          sudo apt-get install -y -qq sshpass >/dev/null
          printf 'pwd\ncd %s\npwd\nls -1\n-ls -1 html\n' "$SFTP_ROOT_PATH" > batch
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=accept-new -P "${SFTP_PORT:-22}" -b batch "$SFTP_USER@$SFTP_HOST" | tee out.txt
          grep -q 'wp-config.php' out.txt && echo "OK: wp-config.php found in the root path" || { echo "::error::wp-config.php not found in SFTP_ROOT_PATH"; exit 1; }
          grep -qx 'toads31' out.txt && echo "OK: toads31 folder found" || echo "::warning::no toads31 folder in the root path"

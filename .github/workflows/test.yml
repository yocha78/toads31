name: Tests

on:
  pull_request:
  push:
    branches: [main, test]

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet cfn-lint
      - run: cfn-lint backend/template.yaml aws/github-deploy-role.yaml

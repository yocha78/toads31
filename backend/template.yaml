AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Toads 31 back end (one stack per stage, test and live)

Parameters:
  Stage:
    Type: String
    AllowedValues: [test, live]
  AllowedOrigin:
    Type: String
    Default: https://brightonpubguide.co.uk
    Description: The only website allowed to call the API from a browser

Conditions:
  IsLive: !Equals [!Ref Stage, live]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        STAGE: !Ref Stage
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  # Single table for players, venues, games, turns and tournaments (REQUIREMENTS 4.7)
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsLive, true, false]
      SSESpecification:
        SSEEnabled: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 600
      # Abuse protection: pub scale is a few requests a second
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: health.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /health
            Method: GET

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api.handler
      # deleting every saved game at once can take a while; the API itself stops waiting at 30 s
      Timeout: 29
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        # the organiser password: /toads31/<stage>/organiser-password (a SecureString)
        - SSMParameterReadPolicy:
            ParameterName: !Sub toads31/${Stage}/*
      Events:
        ListPlayers:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /players, Method: GET}
        AddPlayer:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /players, Method: POST}
        ListVenues:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /venues, Method: GET}
        AddVenue:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /venues, Method: POST}
        SaveGame:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /games, Method: POST}
        ListGames:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /games, Method: GET}
        OrganiserLogin:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /auth/organiser, Method: POST}
        PlayerStats:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/players/{id}/stats", Method: GET}
        UpdatePlayer:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/players/{id}", Method: PATCH}
        DeletePlayer:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/players/{id}", Method: DELETE}
        MergePlayer:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/players/{id}/merge", Method: POST}
        UpdateVenue:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/venues/{id}", Method: PATCH}
        DeleteVenue:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/venues/{id}", Method: DELETE}
        GetGame:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/games/{id}", Method: GET}
        CreateTournament:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /tournaments, Method: POST}
        ListTournaments:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /tournaments, Method: GET}
        GetTournament:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/tournaments/{id}", Method: GET}
        DeleteTournament:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/tournaments/{id}", Method: DELETE}
        EndTournament:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/tournaments/{id}/end", Method: POST}
        ClaimTable:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/tournaments/{id}/tables/{n}/claim", Method: POST}
        ReleaseTable:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/tournaments/{id}/tables/{n}/release", Method: POST}
        PlayTable:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/tournaments/{id}/tables/{n}/play", Method: POST}
        EditTournament:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/tournaments/{id}", Method: PATCH}
        RestartTournament:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/tournaments/{id}/restart", Method: POST}
        DeleteGame:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/games/{id}", Method: DELETE}
        DeleteAllGames:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /games, Method: DELETE}
        DeletePlayerGames:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/players/{id}/games", Method: DELETE}

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  HealthLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base address of the API, written into the app's config.js
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
